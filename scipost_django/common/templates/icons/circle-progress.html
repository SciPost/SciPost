{% load common_extras %}

{% with rad_mult=40|multiply:2|multiply:3.14159|multiply:0.01 %}
  <svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width={{ width|default:100 }} height={{ height|default:100 }}>
    <circle 
      cx=50
      cy=50
      r=40
      stroke="lightgray"
      stroke-width=10
      fill="none"
      transform="rotate(-90 50 50)"
    />
    <circle
      cx=50
      cy=50
      r=40
      stroke={{ color|default:"black" }}
      stroke-width=10
      fill="none"
      stroke-dasharray="{{ rad_mult|multiply:value }} {{ rad_mult }}"
      transform="rotate(-90 50 50)"
    />
    <text
      x=50
      y=50
      text-anchor="middle"
      dominant-baseline="central"
      font-size={{ fontsize|default:20 }}
      fill={{ color|default:"black" }}
    >
      {{ value|floatformat:0 }}%
    </text>
  </svg>
{% endwith %}
